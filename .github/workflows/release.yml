name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          # Pinned: this is the job holding id-token: write for PyPI Trusted Publishing,
          # and it was the last unpinned third-party install in the repo. Bump these
          # deliberately, the same way ruff is pinned in ci.yml.
          python -m pip install build==1.5.0 twine==7.0.0
          python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Install the built wheel and smoke-test it (incl. bundled UI/data)
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/python -m pip install dist/*.whl
          /tmp/v/bin/python -c "import hopandhaul, hopandhaul.server"
          /tmp/v/bin/hopandhaul --help >/dev/null
          unzip -l dist/*.whl | grep -q "hopandhaul/ui/"
          unzip -l dist/*.whl | grep -q "hopandhaul/data/"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
